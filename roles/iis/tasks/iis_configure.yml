---
# =============================================================================
# roles/iis/tasks/iis_configure.yml - IIS configuration
# =============================================================================
# Configures IIS: log/temp paths, app pools, default site,
# basic security hardening. Uses microsoft.iis collection.
# Tags: iis_configure

# --- IIS global log and compression settings --------------------------------
# Three related settings in one PowerShell call for efficiency
# and atomic change (all succeed or nothing changes).
- name: Configure IIS log and compression paths
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $changed = $false

      # IIS stores enum properties as plain integers, not typed enums.
      # Values from IIS_schema.xml: logFormat IIS=0,NCSA=1,W3C=2,Custom=3;
      # period MaxSize=0,Daily=1,Weekly=2,Monthly=3,Hourly=4.
      # When a property equals the schema default, IIS omits it from
      # applicationHost.config and Get-WebConfigurationProperty returns $null.
      # Treat $null as "already at default, no change needed."
      $enumMaps = @{
        logFormat = @{ IIS=0; NCSA=1; W3C=2; Custom=3 }
        period    = @{ MaxSize=0; Daily=1; Weekly=2; Monthly=3; Hourly=4 }
      }

      $settings = @(
        @{
          filter = "system.applicationHost/sites/siteDefaults/logFile"
          props  = @{
            directory = "{{ iis_logs_path }}"
            logFormat = "{{ iis_log_format }}"
            period    = "{{ iis_log_period }}"
          }
        },
        @{
          filter = "system.webServer/httpCompression"
          props  = @{ directory = "{{ iis_compression_path }}" }
        }
      )

      foreach ($setting in $settings) {
        foreach ($prop in $setting.props.GetEnumerator()) {
          $raw = (Get-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
            -filter $setting.filter -name $prop.Key).Value

          $needsChange = if ($enumMaps.ContainsKey($prop.Key)) {
            # null means IIS is using the schema default; assume it already matches
            ($null -ne $raw) -and ([int]$raw -ne $enumMaps[$prop.Key][$prop.Value])
          } else {
            $current = if ($raw -is [System.Enum]) { $raw.ToString() } else { [string]$raw }
            $current -ine $prop.Value
          }

          if ($needsChange) {
            Set-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
              -filter $setting.filter -name $prop.Key -value $prop.Value
            $changed = $true
          }
        }
      }
      $Ansible.Changed = $changed
  notify: "restart iis"
  tags:
    - iis_configure
    - iis_logging

# --- Default Application Pool configuration ---------------------------------
- name: Configure Default Application Pool
  microsoft.iis.web_app_pool:
    name: "{{ iis_default_app_pool }}"
    state: started
    attributes:
      managedRuntimeVersion: ""        # Empty = No Managed Code (.NET Core / .NET 5+)
      managedPipelineMode: Integrated
      recycling.periodicRestart.time: "00:00:00"
      processModel.idleTimeout: "00:20:00"
      processModel.loadUserProfile: "true"
      processModel.identityType: ApplicationPoolIdentity  # CIS IIS 10 Benchmark 1.4
      failure.rapidFailProtection: "true"
      failure.rapidFailProtectionMaxCrashes: "5"
  tags:
    - iis_configure
    - app_pools

# --- Default Web Site configuration -----------------------------------------
- name: Configure Default Web Site path and application pool
  microsoft.iis.website:
    name: "{{ iis_default_site_name }}"
    state: started
    physical_path: "{{ iis_wwwroot_path }}\\default"
    application_pool: "{{ iis_default_app_pool }}"
  notify: "restart iis"
  tags:
    - iis_configure
    - default_site

# microsoft.iis.website removes existing bindings when it modifies the site.
# Restore the HTTP binding if absent so IIS keeps listening on port 80.
- name: Ensure Default Web Site has HTTP binding on port {{ iis_http_port }}
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $siteName = "{{ iis_default_site_name }}"
      $existing = Get-WebBinding -Name $siteName -Protocol "http" `
        -Port {{ iis_http_port }} -ErrorAction SilentlyContinue
      if (-not $existing) {
        New-WebBinding -Name $siteName -Protocol "http" `
          -Port {{ iis_http_port }} -IPAddress "*"
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  notify: "restart iis"
  tags:
    - iis_configure
    - default_site

# --- Site-specific log directory --------------------------------------------
- name: Create and configure log directory for Default Web Site
  tags:
    - iis_configure
    - iis_logging
  block:
    - name: Create log directory for Default Web Site
      ansible.windows.win_file:
        path: "{{ iis_logs_path }}\\default"
        state: directory

    - name: Set log directory for Default Web Site
      ansible.windows.win_powershell:
        script: |
          Import-Module WebAdministration -ErrorAction Stop
          $current = (Get-ItemProperty "IIS:\Sites\{{ iis_default_site_name }}" -name logFile.directory).Value
          $new     = "{{ iis_logs_path }}\\default"
          if ($current -ne $new) {
            Set-ItemProperty "IIS:\Sites\{{ iis_default_site_name }}" -name logFile.directory -value $new
            $Ansible.Changed = $true
          } else {
            $Ansible.Changed = $false
          }

# --- Security: request filtering --------------------------------------------
# Adjust limits for modern applications; hide version information.
- name: Configure IIS security settings
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $changed = $false
      $pspath  = 'MACHINE/WEBROOT/APPHOST'

      # Request limits (URL length, query string, content)
      $limits = @{
        maxUrl                  = 4096
        maxQueryString          = 2048
        maxAllowedContentLength = 31457280  # 30 MB
      }
      foreach ($limit in $limits.GetEnumerator()) {
        $current = (Get-WebConfigurationProperty -pspath $pspath `
          -filter "system.webServer/security/requestFiltering/requestLimits" `
          -name $limit.Key).Value
        if ($current -ne $limit.Value) {
          Set-WebConfigurationProperty -pspath $pspath `
            -filter "system.webServer/security/requestFiltering/requestLimits" `
            -name $limit.Key -value $limit.Value
          $changed = $true
        }
      }

      # Remove X-Powered-By header (leaks technology information)
      $xpb = Get-WebConfigurationProperty -pspath $pspath `
        -filter "system.webServer/httpProtocol/customHeaders" -name "." |
        Where-Object { $_.Value.name -eq "X-Powered-By" }
      if ($xpb) {
        Remove-WebConfigurationProperty -pspath $pspath `
          -filter "system.webServer/httpProtocol/customHeaders" `
          -name "." -AtElement @{name='X-Powered-By'}
        $changed = $true
      }

      $Ansible.Changed = $changed
  tags:
    - iis_configure
    - iis_security

# --- CIS IIS 10 Benchmark 1.3: disable directory browsing -------------------
- name: Disable directory browsing globally
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $current = (Get-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
        -filter 'system.webServer/directoryBrowse' -name 'enabled').Value
      if ([bool]$current -ne $false) {
        Set-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
          -filter 'system.webServer/directoryBrowse' -name 'enabled' -value $false
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  tags:
    - iis_configure
    - iis_security

# --- CIS IIS 10 Benchmark 4.6: disable HTTP TRACE method --------------------
- name: Disable HTTP TRACE method via request filtering
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $pspath = 'MACHINE/WEBROOT/APPHOST'
      $filter = 'system.webServer/security/requestFiltering/verbs'
      # Use Get-WebConfiguration (not Get-WebConfigurationProperty) so the full
      # Collection object is returned with correct attribute types. This avoids
      # the string/bool ambiguity of the ConfigurationElementCollectionProxy.
      $verbs = Get-WebConfiguration -pspath $pspath -filter $filter
      $traceBlocked = $false
      if ($verbs -and $verbs.Collection) {
        $traceBlocked = [bool]($verbs.Collection |
          Where-Object { $_.verb -eq 'TRACE' -and $_.allowed -eq $false })
      }
      if (-not $traceBlocked) {
        Remove-WebConfigurationProperty -pspath $pspath -filter $filter `
          -name '.' -AtElement @{verb='TRACE'} -ErrorAction SilentlyContinue
        Add-WebConfigurationProperty -pspath $pspath -filter $filter `
          -name '.' -value @{verb='TRACE'; allowed=$false}
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  tags:
    - iis_configure
    - iis_security

# --- CIS IIS 10 Benchmark 3.1: hide detailed errors from remote clients ------
- name: Set custom error mode to DetailedLocalOnly
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $pspath = 'MACHINE/WEBROOT/APPHOST'
      $filter = 'system.webServer/httpErrors'
      # errorMode: 0=Detailed, 1=Custom, 2=DetailedLocalOnly
      # null means IIS is using the schema default, which IS DetailedLocalOnly.
      # Only change if an explicit non-default value has been set.
      $raw = (Get-WebConfigurationProperty -pspath $pspath -filter $filter -name 'errorMode').Value
      if (($null -ne $raw) -and ([int]$raw -ne 2)) {
        Set-WebConfigurationProperty -pspath $pspath -filter $filter `
          -name 'errorMode' -value 'DetailedLocalOnly'
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  tags:
    - iis_configure
    - iis_security

# --- CIS IIS 10 Benchmark 5.x: ensure required log fields are enabled --------
# Required fields: Date, Time, ClientIP, UserName, Method, UriStem, UriQuery,
# HttpStatus, TimeTaken, HttpSubStatus, ServerPort, Win32Status
# Bitmask: 1+2+4+8+128+256+512+2048+4096+8192+32768+65536 = 113551
- name: Configure required W3C log fields
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $pspath   = 'MACHINE/WEBROOT/APPHOST'
      $filter   = 'system.applicationHost/sites/siteDefaults/logFile'
      $required = 113551
      # Use Get-WebConfiguration to read the effective value (never null, includes
      # schema defaults). Get-WebConfigurationProperty can return null for properties
      # that equal the schema default, causing idempotency failures.
      $logFile = Get-WebConfiguration -pspath $pspath -filter $filter
      $rawVal  = $logFile.logExtFileFlags
      $current = [System.Convert]::ToInt32($rawVal)
      $Ansible.Result = @{
        current_raw  = [string]$rawVal
        current_type = $rawVal.GetType().FullName
        current_int  = $current
        required     = $required
        bits_ok      = (($current -band $required) -eq $required)
      }
      if (($current -band $required) -ne $required) {
        Set-WebConfigurationProperty -pspath $pspath -filter $filter `
          -name 'logExtFileFlags' -value ($current -bor $required)
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  tags:
    - iis_configure
    - iis_logging

# --- Hide server response header (registry) ---------------------------------
- name: Disable IIS server version header via registry
  ansible.windows.win_regedit:
    path: "HKLM:\\SYSTEM\\CurrentControlSet\\Services\\HTTP\\Parameters"
    name: "DisableServerHeader"
    data: 1
    type: dword
  notify: "restart iis"
  tags:
    - iis_configure
    - iis_security

# --- Flush handlers ---------------------------------------------------------
- name: Flush handlers after IIS configuration
  ansible.builtin.meta: flush_handlers
  tags: [iis_configure]

# --- Verification -----------------------------------------------------------
- name: Verify IIS configuration
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration -ErrorAction Stop
      $site    = Get-Website -Name "{{ iis_default_site_name }}"
      $logDir  = (Get-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
        -filter "system.applicationHost/sites/siteDefaults/logFile" -name "directory").Value
      $compDir = (Get-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' `
        -filter "system.webServer/httpCompression" -name "directory").Value
      $bindings = (Get-WebBinding -Name "{{ iis_default_site_name }}") |
        ForEach-Object { "$($_.protocol)://$($_.bindingInformation)" }
      $Ansible.Result  = @{
        site_path    = $site.PhysicalPath
        site_state   = $site.State
        log_dir      = $logDir
        compress_dir = $compDir
        bindings     = $bindings
      }
      $Ansible.Changed = $false
  register: iis_verify
  tags: [iis_configure]

- name: IIS configuration summary
  ansible.builtin.debug:
    msg:
      - "Site path:        {{ iis_verify.result.site_path }}"
      - "Site state:       {{ iis_verify.result.site_state }}"
      - "Bindings:         {{ iis_verify.result.bindings }}"
      - "Log directory:    {{ iis_verify.result.log_dir }}"
      - "Compression temp: {{ iis_verify.result.compress_dir }}"
  tags: [iis_configure]

# --- Verify default IIS firewall rules --------------------------------------
# IIS installation activates two built-in Windows Firewall rules for HTTP and
# HTTPS. Verify they exist and are enabled for all profiles (Domain, Private,
# Public). If a rule is disabled or scoped to a subset of profiles, correct it.
- name: Verify default IIS firewall rules are enabled for all profiles
  ansible.windows.win_powershell:
    script: |
      $rules = @(
        "World Wide Web Services (HTTP Traffic-In)",
        "World Wide Web Services (HTTPS Traffic-In)"
      )
      $results = @()
      $changed = $false

      foreach ($displayName in $rules) {
        $rule = Get-NetFirewallRule -DisplayName $displayName -ErrorAction SilentlyContinue
        if (-not $rule) {
          Write-Error "Default IIS firewall rule '$displayName' not found. Verify IIS Windows features are installed."
          exit 1
        }

        $updates = @()

        if ($rule.Enabled -ne $true) {
          Enable-NetFirewallRule -DisplayName $displayName
          $updates += "enabled"
          $changed = $true
        }

        if ($rule.Profile -ne 'Any') {
          Set-NetFirewallRule -DisplayName $displayName -Profile Any
          $updates += "profile set to Any"
          $changed = $true
        }

        $status = if ($updates.Count -gt 0) { "updated ($($updates -join ', '))" } else { "ok" }
        $results += "$displayName`: $status"
      }

      $Ansible.Result = $results
      $Ansible.Changed = $changed
  register: iis_firewall_check
  tags:
    - iis_configure
    - firewall

- name: Show IIS firewall rule status
  ansible.builtin.debug:
    msg: "{{ iis_firewall_check.result }}"
  tags:
    - iis_configure
    - firewall
